name = "expensive-expenses"
main = "worker/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

# The React app (built into web/dist) is served as static assets.
# Every /api/* request goes to the Worker first.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# One SQLite-backed Durable Object holds all data (works on the free plan).
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[observability]
enabled = true
